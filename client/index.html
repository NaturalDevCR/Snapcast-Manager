<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Theme init must run synchronously here, before any CSS paints and
      before Vue mounts, so that:
        1. Login.vue and Setup.vue (which don't render Layout.vue, and
           therefore never triggered the old Layout.vue-onMounted-only
           initTheme() call) get the correct theme class from the very
           first paint.
        2. Every route avoids a flash-of-wrong-theme between first paint
           and Vue's mount (which previously always rendered hardcoded
           class="dark" for a frame regardless of stored preference).

      v0.3.8 fix: this used to be inline here. helmet's CSP (server/src/
      index.ts) is `script-src 'self'` with no 'unsafe-inline' -- browsers
      silently block inline <script> tags under that policy, so this NEVER
      RAN on any real (server-served) deployment, regardless of what was
      stored in localStorage. Moved to an external same-origin file
      (theme-init.js, served from client/public/ -- see that file for the
      full account), which `script-src 'self'` allows with no CSP change.
      A plain (non-module, non-defer) <script src> still blocks parsing
      and runs synchronously in document order, same as the inline version
      did -- required for both guarantees above.
    -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#a60df2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapcast Manager</title>

    <!--
      Inter and Material Symbols Outlined are self-hosted (Task 20) via
      @font-face rules in client/src/fonts.css, imported from style.css.
      This app runs on LANs with no outbound internet (e.g. a Raspberry Pi
      snapserver box), so a fonts.googleapis.com/fonts.gstatic.com CDN
      dependency here used to make Material Symbols icons render as literal
      text ("settings_input_antenna") instead of glyphs - see
      .superpowers/sdd/task-20-report.md.
    -->
  </head>
  <body class="bg-brand-bg text-text-main antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
