# Dependabot keeps the three npm packages (root lint tooling, client, server)
# and the workflow actions current, and opens security updates as soon as an
# advisory lands instead of waiting for someone to run `npm audit` by hand.
version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/client"
      - "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
