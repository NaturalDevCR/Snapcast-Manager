name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history + tags, not the default shallow single-commit
          # checkout -- git-cliff (CHANGELOG.md generation, see the "Update
          # CHANGELOG.md" step below) needs the complete conventional-commit
          # log and every tag to group releases correctly; a shallow clone
          # would silently produce a near-empty changelog.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Build Server
        working-directory: ./server
        run: |
          npm ci
          npm run build

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Prepare Release Package
        run: |
          mkdir release_package
          # Only include necessary files to run
          cp -r server/dist release_package/server_dist
          cp server/package.json release_package/server_package.json
          cp server/package-lock.json release_package/server_package-lock.json

          mkdir release_package/client
          cp -r client/dist release_package/client/dist

          mkdir release_package/scripts
          cp scripts/install.sh release_package/scripts/install.sh

          # Post-Task-65 fix (found while preparing to publish a release
          # after fixing a missing sudoers.d grant -- checking whether that
          # fix would even reach a real install via THIS workflow surfaced
          # that it never would have): install.sh resolves both of these
          # relative to its OWN on-disk location at install time --
          # `$INSTALL_DIR/scripts/sudoers.d/snapcast-manager` (Step 6,
          # SUDOERS_SRC) and `$SCRIPT_DIR/lib/migration.sh` (top of the
          # script) -- neither was ever copied into release_package here.
          # `scripts/sudoers.d/` missing is the serious one: install.sh
          # treats a missing SUDOERS_SRC as non-fatal (prints "[!] ... not
          # found in this release -- skipping sudoers.d installation." and
          # continues), which means EVERY install done via the documented
          # `curl | bash` remote-download flow -- pulling this exact
          # release zip -- has silently run with NO sudoers.d grant at all
          # since Task 16 first introduced the privilege-hardening model:
          # every privileged operation (package install/update, systemd
          # service control, every installPrivilegedFile() config write)
          # would fail with "sudo: a password is required". This was never
          # caught because every previous real-hardware/container
          # verification (Task 65, and this fix pass's own re-verification)
          # exercised install.sh's LOCAL-source flow (a full repo checkout,
          # where scripts/sudoers.d/ genuinely exists on disk already), not
          # a real downloaded release zip. `scripts/lib/migration.sh`
          # missing is comparatively benign -- install.sh already guards
          # its `source` with `if [ -f ... ]` and falls back to always
          # running the full, idempotent migration steps rather than
          # skipping them -- but it's packaged too now since the code's own
          # comment already assumed it "ships alongside install.sh itself".
          cp -r scripts/sudoers.d release_package/scripts/sudoers.d
          cp -r scripts/lib release_package/scripts/lib

          # Modify the install script to work with the prebuilt files
          cd release_package

          # The release structure is slightly different to avoid exposing source
          # Re-create server/ structure
          mkdir server
          mv server_dist server/dist
          mv server_package.json server/package.json
          mv server_package-lock.json server/package-lock.json

          # server/src/services/system.ts's installShairportSync() resolves
          # this script at runtime relative to its own compiled location
          # (server/dist/services/system.js -> ../../scripts/... ->
          # server/scripts/...), so it must be packaged at that exact path,
          # not just under the top-level scripts/ dir above (Task 12).
          mkdir -p server/scripts
          cp ../server/scripts/install-shairport-sync.sh server/scripts/install-shairport-sync.sh
          chmod +x server/scripts/install-shairport-sync.sh

          zip -r ../snapcast-manager-release.zip ./*

      - name: Compute Release Checksum
        run: |
          # Publishes a human-readable, downloadable SHA256 checksum file
          # alongside the release .zip (Task 75, requirement 1). This is
          # separate from -- and complementary to -- the digest/size fields
          # GitHub itself computes automatically for every release asset
          # (confirmed present via a real `curl` against this repo's own
          # releases API; see .superpowers/sdd/task-75-report.md), which is
          # what scripts/install.sh actually verifies against
          # programmatically (requirement 3). Standard `sha256sum` output
          # format (`<hex-digest>  <filename>`), so it's also directly
          # `sha256sum -c`-able by anyone who downloads both files by hand.
          sha256sum snapcast-manager-release.zip > snapcast-manager-release.zip.sha256
          cat snapcast-manager-release.zip.sha256

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          # Regenerates CHANGELOG.md from this release's full conventional-
          # commit history (Task 75, requirement 2) and commits it back to
          # the branch the release tag points at, so the committed
          # CHANGELOG.md stays in sync with the repo across releases -- the
          # per-release notes GitHub itself auto-generates below
          # (`generate_release_notes: true`) are a DIFFERENT, separate
          # thing (per-tag release-page prose, not an accumulating
          # committed file). Gated on there actually being a diff, since a
          # release with no new conventional commits since the last run
          # would otherwise produce an empty, failing commit.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, nothing to commit."
          else
            git add CHANGELOG.md
            git commit -m "docs(changelog): update CHANGELOG.md for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            snapcast-manager-release.zip
            snapcast-manager-release.zip.sha256
          generate_release_notes: true
